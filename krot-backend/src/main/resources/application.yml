app:
  security:
    secured-transport-protocol:
      enable-incoming: true
      enable-outcoming: true
    handshake:
      nonce-window: 86400000 # TODO: Testing value! Recommended is from 1000 to 5000
      private-key: sF6T9LT1AOjsEoPwD7NocuQvewQaCYyf9cR9F5upkW0=
      public-key: zSkMxt/GdIKUV4jsbOORZnRKrafMbkVXCc1CdlFvDCA=
    session:
      session-duration: 525600 # TODO: Testing value! Recommended is from 60 to 120
quarkus:
  datasource:
    db-kind: postgresql
    username: postgres
    password: test18072009
    reactive:
      url: postgresql://localhost:5432/krot
      max-size: 20
  hibernate-orm:
    schema-management:
      strategy: drop-and-create
  redis:
    hosts: redis://localhost:6379/0
    max-pool-size: 100
    timeout: 5s
  http:
    auth:
      proactive: false
  kafka-deserializer:
    value:
      jackson:
        type: com.egorgoncharov.krot.backend.application.events.delivery.source.kafka.KafkaEvent
kafka:
  bootstrap:
    servers:
      - localhost:9092
mp:
  messaging:
    connector:
      smallrye-kafka:
        key:
          serializer: org.apache.kafka.common.serialization.StringSerializer
          deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value:
          serializer: io.quarkus.kafka.client.serialization.ObjectMapperSerializer
          deserializer: com.egorgoncharov.krot.backend.application.events.delivery.source.kafka.KafkaEventDeserializer
        auto.offset.reset: earliest
    outgoing:
      "krot.out.user":
        topic: krot-user-events
      "krot.out.session":
        topic: krot-session-events
      "krot.out.program":
        topic: krot-program-events
      "krot.out.role":
        topic: krot-role-events
      "krot.out.device":
        topic: krot-device-events
    incoming:
      "krot.in.user":
        topic: krot-user-events
      "krot.in.session":
        topic: krot-session-events
      "krot.in.program":
        topic: krot-program-events
      "krot.in.role":
        topic: krot-role-events
      "krot.in.device":
        topic: krot-device-events
